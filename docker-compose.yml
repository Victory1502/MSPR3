services:
  minio:
    hostname: minio
    image: "minio/minio"
    container_name: minio
    ports:
      - "9001:9001"
      - "9000:9000"
    command: [ "server", "/data", "--console-address", ":9001" ]
    volumes:
      - ./minio:/data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    networks:
      - goodair_network

  postgres:
    hostname: postgres
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: mspr3
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - goodair_network

  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - goodair_network

  airflow-init:
    image: apache/airflow:2.7.1
    container_name: airflow-init
    depends_on:
      - airflow-postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    command: >
      bash -c "pip install -r /requirements.txt && airflow db init"
    user: "0:0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - .:/opt/airflow/project
      - ./requirements.txt:/requirements.txt
    networks:
      - goodair_network

  airflow-webserver:
    image: apache/airflow:2.7.1
    container_name: airflow-webserver
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    ports:
      - "8080:8080"
    restart: always
    command: >
      bash -c "pip install -r /requirements.txt && airflow webserver"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - .:/opt/airflow/project
      - ./requirements.txt:/requirements.txt
    networks:
      - goodair_network

  airflow-scheduler:
    image: apache/airflow:2.7.1
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
      AIRFLOW__SMTP__SMTP_PORT: 587
      AIRFLOW__SMTP__SMTP_USER: victorycorporation15@gmail.com
      AIRFLOW__SMTP__SMTP_PASSWORD: pdwx oyuj prxe iwxl
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ELECTRO_CHOC@holding.com
      AIRFLOW__SMTP__SMTP_STARTTLS: 'True'
      AIRFLOW__SMTP__SMTP_SSL: 'False'
    restart: always
    command: >
      bash -c "pip install -r /requirements.txt && airflow scheduler"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - .:/opt/airflow/project
      - ./requirements.txt:/requirements.txt
    networks:
      - goodair_network

  airflow-cli:
    image: apache/airflow:2.7.1
    container_name: airflow-cli
    entrypoint: bash
    working_dir: /opt/airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - .:/opt/airflow/project
      - ./requirements.txt:/requirements.txt
    networks:
      - goodair_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-goodair
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=goodair123
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - goodair_network
    depends_on:
      - postgres

  # ===== ELASTICSEARCH & KIBANA =====
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - goodair_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - goodair_network

  # ===== SIMPLE DATA LINEAGE avec Marquez =====
  marquez-db:
    image: postgres:12
    container_name: marquez-db
    environment:
      - POSTGRES_USER=marquez
      - POSTGRES_PASSWORD=marquez
      - POSTGRES_DB=marquez
    volumes:
      - marquez_data:/var/lib/postgresql/data
    networks:
      - goodair_network

  marquez:
    image: marquezproject/marquez:0.45.0
    container_name: marquez
    environment:
      - MARQUEZ_DB_HOST=marquez-db
      - MARQUEZ_DB_PORT=5432
      - MARQUEZ_DB_NAME=marquez
      - MARQUEZ_DB_USER=marquez
      - MARQUEZ_DB_PASSWORD=marquez
    ports:
      - "3001:3001"
      - "5000:5000"
    depends_on:
      - marquez-db
    networks:
      - goodair_network

  # ===== SIMPLE DATA CATALOG avec Apache Atlas alternatif =====
  # Utilisation d'Amundsen comme alternative plus légère
  amundsen-metadata:
    image: amundsendev/amundsen-metadata:3.0.0
    container_name: amundsen-metadata
    environment:
      - METADATA_SVC_CONFIG_MODULE_CLASS=metadata_service.config.LocalConfig
    ports:
      - "5002:5000"
    networks:
      - goodair_network

  amundsen-frontend:
    image: amundsendev/amundsen-frontend:3.0.0
    container_name: amundsen-frontend
    environment:
      - SEARCHSERVICE_BASE=http://amundsen-search:5000
      - METADATASERVICE_BASE=http://amundsen-metadata:5000
    ports:
      - "5000:5000"
    depends_on:
      - amundsen-metadata
    networks:
      - goodair_network

  # ===== APACHE NIFI version stable =====
  nifi:
    image: apache/nifi:1.18.0
    container_name: nifi
    ports:
      - "8443:8443"
      - "8083:8080"
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      - NIFI_WEB_HTTPS_PORT=8443
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=goodair123456
    volumes:
      - nifi_data:/opt/nifi/nifi-current/logs
      - nifi_conf:/opt/nifi/nifi-current/conf
      - ./nifi/templates:/opt/nifi/nifi-current/conf/templates
    networks:
      - goodair_network

networks:
  goodair_network:
    driver: bridge

volumes:
  grafana_data:
    driver: local
  pg_data:
    driver: local
  airflow_postgres_data:
    driver: local
  marquez_data:
    driver: local
  elasticsearch_data:
    driver: local
  nifi_data:
    driver: local
  nifi_conf:
    driver: local